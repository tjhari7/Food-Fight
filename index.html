<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Same mark, plate and 62% scale as the home-screen icons (see
         scripts/generate-icons.js, npm run icons) — this file used to be an
         inline data-URI copy of the raw path in #E62E2E with no plate, which
         is why the browser tab and the installed app used to look like two
         different reds. Regenerate with `npm run icons` rather than hand-editing
         the SVG in public/. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `viewport-fit=cover` is not decoration: it is the switch that makes
         every `env(safe-area-inset-*)` in the stylesheets return something other
         than 0px. Installed to the home screen this app draws its own status bar
         and home indicator strips (see the apple-mobile-web-app-* block below),
         and without this token those insets silently collapse to zero and the
         page slides under the clock and the indicator. Removing it breaks the
         layout only on a phone, only in standalone — nowhere it would be
         noticed in a desktop browser. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF6E8" />
    <title>Food Fight</title>

    <!-- Installability. There is deliberately no service worker: the app is a
         thin client over Supabase and could not do anything useful offline, and
         skipping it means a deploy is live on the next launch instead of the one
         after that.

         manifest.webmanifest's `background_color` MUST stay equal to
         --color-bg (#FAF6E8). It is what iOS paints behind the launch screen it
         derives from the manifest, so a drifted value shows as a flash of the
         wrong cream on every cold start. JSON takes no comments, hence the note
         here.

         The apple-touch-icon is a separate 180px file rather than a manifest
         entry because iOS reads this tag, not the manifest icons, when the user
         taps Add to Home Screen. Both come out of `npm run icons`. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Food Fight" />
    <!-- `black-translucent` lets the cream run edge to edge under the clock.
         The alternative, `default`, has iOS draw an opaque white bar above the
         page, which against #FAF6E8 reads as a seam rather than a status bar.
         The cost is that the page now starts at y=0 with the clock on top of it,
         which is what the safe-area-inset-top padding on `.page` in index.css is
         there to answer. The two are a pair — changing this to `default` makes
         that padding double-count, and dropping that padding puts headings under
         the clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The homepage hero, and the first thing onboarding shows. It is the LCP
         element on both, and without this it is close to the last thing
         requested: the <img> only enters the DOM once the bundle has downloaded,
         parsed and mounted React, so the fetch could not even start until all of
         that had finished. Declared here it is found by the preload scanner
         during head parse and downloads alongside the bundle instead of after
         it.

         The href is the source path on purpose — Vite rewrites link[href] to the
         hashed build filename, so this must not be hardcoded to a hashed name.
         Verify it still points at a real asset after any change to how the hero
         is imported; a stale path here fails silently as a console warning and a
         hero that loads late again.

         No crossorigin: the <img> that consumes this has none either, and the
         two have to match or the preload is discarded and the image downloads
         twice. -->
    <link
      rel="preload"
      href="/src/assets/Pizza_VS_Taco_Fight_Hero.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Instrument Serif used to be requested here too. It was reaching exactly
         one heading, and only because .ob-success__title forgot a font-family;
         that rule now names Gliker like every other heading, so nothing is left
         to render it. -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,900&display=swap"
      rel="stylesheet"
    />
    <!-- Subset to the icons actually rendered. Unqualified, this URL asks for
         every axis at full range across all ~3,300 icons and Google returns
         3.78MB — five times the weight of every image in the app combined, for
         18 glyphs.
         `icon_names` is what does the work (3.96MB -> 4KB). The axis tuple has
         to stay in css2's required order (lowercase alphabetical, then
         uppercase), and FILL MUST remain a 0..1 range rather than a pinned
         value: IconButton, MealCard and GroupDrawer all set 'FILL' 1, and
         IconButton.css transitions the axis, which a static instance cannot do.
         opsz/wght/GRAD are pinned because 24/400/0 are the only values used.
         Adding an icon anywhere means adding it to this list, or it renders as
         its own ligature text — the literal word "search" — instead of a glyph.
         Three of these (pause, visibility, visibility_off) are only reachable
         through ternaries in VoiceAdd and Account, so grep for `name={` as well
         as `name="` when auditing this. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=add,check_circle,chevron_left,chevron_right,close,content_copy,delete,edit,expand_less,group_add,ios_share,mic,more_vert,pause,search,tune,visibility,visibility_off"
      rel="stylesheet"
    />
    <!-- Every Gliker face the app renders, preloaded together so no heading
         can swap in late. A woff2 is only requested once CSS matches a rule
         that names it, which on a hashed stylesheet is several hundred KB into
         the critical path; declared here they are found by the preload scanner
         during head parse and download alongside the bundle instead of behind
         it. `crossorigin` is required even same-origin — fonts are fetched in
         CORS mode, and without it the preload is discarded and the font
         downloads a second time.
         These are the five faces with rules pointing at them. public/fonts
         holds four more (Bold, RegularCondensed, RegularSemiCondensed,
         BoldSemiCondensed) that have @font-face blocks in index.css and no
         rule anywhere using them — preloading those would pull 118KB nothing
         renders and trip the browser's "preloaded but not used" warning.
         Anything that starts using one belongs on this list. -->
    <link rel="preload" href="/fonts/Gliker-BlackExtraExpanded.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Gliker-Black.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Gliker-BlackSemiExpanded.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Gliker-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Gliker-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Inline so red is painted before the bundle parses; index.css arrives
         with the bundle, so --color-accent is not available yet and the value
         has to be repeated here. Keep in sync with --color-accent. */
      /* overflow:hidden clips the reveal circle BootReveal scales away so it
         never spills past the frame. No `will-change: clip-path` — the reveal is
         a `transform: scale()` circle now, not an animated clip-path (which
         mis-centres on some GPUs; see IrisTransition.css / BootReveal.jsx). */
      #boot-iris {
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        background: #DF2121;
      }
      /* Match the desktop device frame (see index.css / lib/iris.js) so the boot
         reveal fills the phone, not the whole window. These MUST stay in sync
         with the .device-frame block in index.css, or the red overlay is offset
         from the frame and the reveal collapses off bottom-centre: top:16px ==
         #root's 16px frame padding; height subtracts that padding top and bottom
         (32px); border-radius matches the frame. Keep the 601px breakpoint in
         sync too. */
      @media (min-width: 601px) {
        #boot-iris {
          top: 16px;
          left: 50%;
          right: auto;
          bottom: auto;
          width: 375px;
          height: min(812px, calc(100dvh - 32px));
          transform: translateX(-50%);
          border-radius: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-iris" aria-hidden="true"></div>
    <script>
      // The boot reveal is homepage-only. Drop the overlay on every other entry
      // point here, synchronously before first paint, so deep links never flash
      // red. BootReveal then finds no node and skips itself.
      if (window.location.pathname !== '/') {
        document.getElementById('boot-iris').remove()
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
