[build]
  command = "npm run build"
  publish = "dist"

# Local `netlify dev` only, ignored by the build. Vite is pinned to 5174 in
# vite.config.js, but netlify dev looks for a framework server on 5173 by
# default and hangs waiting for a port nothing is listening on. Keep this in
# sync with server.port there.
[dev]
  targetPort = 5174
  port = 8888

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
