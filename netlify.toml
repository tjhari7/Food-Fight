[build]
  command = "npm run build"
  publish = "dist"

# Local `netlify dev` only, ignored by the build. Vite is pinned to 5174 in
# vite.config.js, but netlify dev looks for a framework server on 5173 by
# default and hangs waiting for a port nothing is listening on. Keep this in
# sync with server.port there.
[dev]
  targetPort = 5174
  port = 8888

# Netlify's default for everything it serves is
# `public, max-age=0, must-revalidate`, which means the browser asks about every
# asset on every visit and waits for a 304 before reusing bytes it already has.
# On a phone that is a round trip per file before anything can paint.
#
# Only /assets/* gets this treatment, and only because Vite fingerprints
# everything it emits there (Pizza_VS_Taco_Fight_Hero-LchPw0bu.webp). The hash
# is derived from the contents, so a changed file is a changed URL and the old
# one can never be stale — which is exactly the condition `immutable` requires.
#
# Do NOT extend this to /fonts/*. Those are copied verbatim out of public/ with
# no hash in the name, so a year of `immutable` on Gliker-Black.woff2 would
# pin every returning visitor to a stale copy with no way to invalidate it
# short of renaming the file.
#
# This is also what makes the speculative fetching in lib/prefetch.js pay off:
# without it a prefetched asset is still revalidated when the user navigates,
# so we would save the download but keep the latency.
[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
